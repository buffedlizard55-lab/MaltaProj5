name: Dead-link check

on:
  push:
    branches:
      - 'arena/c961fbe4-maltaproj5'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch every cited URL
        run: python tools/remotecheck.py --timeout 20
