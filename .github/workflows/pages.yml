name: Validate site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the register and the site from source data
        run: |
          python tools/consolidate.py
          python tools/apply_verify.py
          python scripts/build.py

      - name: Validate data, evidence and local links
        run: python scripts/validate.py

      - name: Ensure committed data and HTML are current (pipeline is reproducible)
        run: git diff --exit-code -- data/ '*.html'

      - name: Check every cited source URL still resolves
        run: python tools/remotecheck.py --timeout 25

      - name: Fetch every cited page and match the event name (report only)
        continue-on-error: true
        run: python tools/verify_rows.py --timeout 25 --out /tmp/verify_report.json


# GitHub Pages is served in branch mode from `main` / (root), so a merge to main
# publishes the committed root HTML automatically. This workflow is the gate: it
# rebuilds from source, validates, checks that generated files are current, and
# verifies that every cited URL still resolves before that merge can land.
