name: Source reachability report

# Manual, report-only replacement for the old row-name matcher. No bot writes to
# canonical data or manufactures verification labels. Captures and approvals are
# separate, and only an explicit audited decision can change a published field.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: URL reachability is not event verification
        run: python tools/check_sources.py --timeout 20 --output /tmp/source-links.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-link-report
          path: /tmp/source-links.json
          if-no-files-found: ignore
