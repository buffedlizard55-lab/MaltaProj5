name: Validate and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py && python scripts/validate.py
      - name: Ensure generated files are current
        run: git diff --exit-code -- '*.html' data/events.csv
      - name: Verify docs/ site (every row sourced, links resolve)
        run: python tools/verify_site.py
      - name: Stage public files (docs/ site primary + root inventory under /inventory/)
        run: |
          mkdir -p _site
          # Primary: full 167-event site built by tools/build_site.py (session 4f47c142)
          cp -r docs/. _site/
          # Secondary: 29-row bounded inventory from parallel session 3a19e72d, preserved at /inventory/
          mkdir -p _site/inventory
          cp *.html _site/inventory/
          cp -r assets _site/inventory/
          mkdir -p _site/inventory/data
          cp data/events.csv data/events.json data/sources.json data/review.json _site/inventory/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
