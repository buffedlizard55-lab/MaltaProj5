name: Validate site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebuild the fail-closed audited register and static site
        run: |
          python tools/consolidate.py
          python scripts/build.py

      - name: Run regression fixtures (no network)
        run: python -m unittest discover -s tests -v

      - name: Validate exact evidence projection, CSVs, every row and local links
        run: python scripts/validate.py

      - name: Require committed generated files to match the reproducible build
        run: |
          git diff --exit-code -- \
            data/events.json data/sources.json data/review.json \
            data/unverified_history.json data/audit_summary.json \
            data/events.csv data/review.csv data/upcoming_order.json ANALYSIS.md \
            index.html upcoming.html focus.html weekly.html monthly.html annual.html special.html \
            gaming.html music.html ai.html free.html \
            markets.html museums.html culture.html community.html \
            analysis.html review.html sources.html

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install optional pinned headless QA tooling outside Git
        run: >-
          npm install --prefix .cache/browser --no-audit --no-fund
          playwright-core@1.64.1 @sparticuz/chromium@153.0.0 axe-core@4.14.0
      - name: Real-browser desktop/mobile and automated accessibility smoke test
        run: NODE_PATH=.cache/browser/node_modules node tests/browser_smoke.cjs --serve
      - name: Preserve browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: .cache/qa/
          if-no-files-found: ignore

      - name: Check every cited URL (reachability only; 404/410 block merge)
        run: python tools/check_sources.py --timeout 20 --output /tmp/source-links.json

      - name: Preserve the honest URL outcomes, including unknowns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-link-report
          path: /tmp/source-links.json
          if-no-files-found: ignore

# Pages is configured separately in branch mode (main / root). A merge publishes
# committed root HTML. This job validates it; it never claims to deploy or to
# semantically verify a fact via a URL response or shared-page name match.
