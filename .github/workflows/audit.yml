name: Official evidence capture

on:
  push:
    branches: [arena/64f8b973-maltaproj5]
    paths:
      - tools/audit_evidence.py
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.ref == 'refs/heads/arena/64f8b973-maltaproj5'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.1.1
      - name: Capture official page text and PDF text (not verification)
        run: |
          python tools/audit_evidence.py --capture --timeout 25 \
            --url https://www.sfzoo.org/event/sf-resident-free-day/ \
            --url https://www.sfzoo.org/event/boo-at-the-zoo/ \
            --url https://www.sfzoo.org/event/member-mornings-2-copy/ \
            --url https://sunsetmercantilesf.com/colevalleynights2026/ \
            --url https://sunsetmercantilesf.com/sunsetholidaymercantile/ \
            --url https://sunsetmercantilesf.com/holidaysontaraval/ \
            --url https://sunsetmercantilesf.com/secondhand/ \
            --url https://sunsetmercantilesf.com/ddlm/ \
            --url https://www.pcfma.org/market/castro-farmers-market \
            --url https://www.pcfma.org/market/divisadero-farmers-market \
            --url https://www.pcfma.org/market/fillmore-farmers-market \
            --url https://sfpl.org/events/special-programs/summer-stride \
            --url https://www.sfmta.com/calendar/muni-heritage-weekend-2026
      - name: Preserve finite evidence snapshot on this session branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "official-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/audit_64f8b973.json
          if git diff --cached --quiet; then
            echo "Evidence snapshot unchanged"
          else
            git commit -m "audit: capture official source text for contextual field review"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
