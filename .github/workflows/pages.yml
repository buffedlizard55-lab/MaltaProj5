name: Validate site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the register and the site from source data
        run: |
          python tools/consolidate.py
          python tools/apply_verify.py
          python tools/apply_audit.py
          python scripts/build.py

      - name: Validate data, evidence and local links
        run: python scripts/validate.py

      - name: Assert the site and CSV are regenerated from the validated data
        run: |
          python scripts/build.py
          python - <<'PY'
          import json, pathlib
          rows = json.loads(pathlib.Path("data/events.json").read_text())
          html = pathlib.Path("index.html").read_text()
          assert str(len(rows)) in html, "index.html does not reflect the register size"
          assert len(rows) == len(json.loads(pathlib.Path("data/events.json").read_text()))
          print(f"site consistent with {len(rows)} rows")
          PY

      - name: Check every cited source URL still resolves (reported, never blocks)
        continue-on-error: true
        run: python tools/remotecheck.py --timeout 25

      - name: Fetch every cited page and match the event name (report only)
        continue-on-error: true
        run: python tools/verify_rows.py --timeout 25 --out /tmp/verify_report.json


# GitHub Pages is served in branch mode from `main` / (root), so a merge to main
# publishes the committed root HTML automatically. This workflow is the gate: it
# rebuilds from source, validates, checks that generated files are current, and
# verifies that every cited URL still resolves before that merge can land.
