name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the register and the site from source data
        run: |
          python tools/consolidate.py
          python tools/apply_verify.py
          python scripts/build.py

      - name: Validate data, evidence and local links
        run: python scripts/validate.py

      - name: Ensure committed data and HTML are current (pipeline is reproducible)
        run: git diff --exit-code -- data/ '*.html'

      - name: Check every cited source URL still resolves
        run: python tools/remotecheck.py --timeout 25

      - name: Fetch every cited page and match the event name (report only)
        continue-on-error: true
        run: python tools/verify_rows.py --timeout 25 --out /tmp/verify_report.json

      - name: Stage public files
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -r assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
